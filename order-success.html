<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Placed Successfully – PHARMAcare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <section class="section" style="padding: 60px 0;">
    <div class="container" style="max-width: 600px; text-align: center;">
      <div class="card" style="padding: 48px 32px;">
        <div style="width: 72px; height: 72px; background: var(--mint); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: var(--green); font-size: 36px;">
          <i class="fas fa-check"></i>
        </div>

        <h1 style="color: var(--navy); font-size: 26px; margin-bottom: 8px;">Order Placed Successfully!</h1>
        <p style="color: var(--muted); font-size: 14px; margin-bottom: 24px;">
          Thank you for choosing PHARMAcare. Your genuine medicines are being prepared for dispatch.
        </p>

        <div id="order-info-box" style="background: var(--grey-bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 18px; margin-bottom: 28px; text-align: left;">
          <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;">
            <span style="color:var(--muted);">Order Reference:</span>
            <strong id="order-ref" style="color:var(--navy);">Loading...</strong>
          </div>
          <div style="display:flex; justify-content:space-between; margin-bottom:8px; font-size:14px;">
            <span style="color:var(--muted);">Status:</span>
            <span class="badge-status status-placed">PLACED</span>
          </div>
          <div style="display:flex; justify-content:space-between; font-size:14px;">
            <span style="color:var(--muted);">Estimated Delivery:</span>
            <span style="color:var(--navy);font-weight:600;">2 – 4 Business Days</span>
          </div>
        </div>

        <div style="display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;">
          <a id="view-order-btn" href="/my-orders.html" class="btn btn-navy">
            <i class="fas fa-receipt"></i> View Order Details
          </a>
          <a href="/medicines.html" class="btn btn-outline-green">
            Continue Shopping
          </a>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async function() {
      var params = new URLSearchParams(window.location.search);
      var orderId = params.get('order_id');

      if (orderId) {
        document.getElementById('view-order-btn').href = '/order-detail.html?id=' + orderId;
        var res = await db.from('orders').select('order_no').eq('id', orderId).maybeSingle();
        if (res && res.data) {
          document.getElementById('order-ref').textContent = '#' + res.data.order_no;
        } else {
          document.getElementById('order-ref').textContent = orderId.substring(0, 8);
        }
      } else {
        document.getElementById('order-ref').textContent = 'Confirmed';
      }
    });
  </script>

</body>
</html>
