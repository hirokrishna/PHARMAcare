<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – PHARMAcare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="form-page">
    <div class="form-card">
      <div class="form-card-header">
        <h1>Reset Password</h1>
        <p>Enter your email to receive a password reset link</p>
      </div>

      <div class="form-alert form-alert-error" id="error-msg"></div>
      <div class="form-alert form-alert-success" id="success-msg"></div>

      <form id="forgot-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <button type="submit" class="btn btn-navy btn-block" id="reset-btn">Send Reset Link</button>
      </form>

      <div class="form-footer-link">
        Remember your password? <a href="/login.html">Back to Login</a>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var errorBox = document.getElementById('error-msg');
      var successBox = document.getElementById('success-msg');
      var btn = document.getElementById('reset-btn');

      errorBox.classList.remove('visible');
      successBox.classList.remove('visible');

      if (!email) {
        errorBox.textContent = 'Please enter your email address.';
        errorBox.classList.add('visible');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      var res = await db.auth.resetPasswordForEmail(email, {
        redirectTo: window.location.origin + '/login.html'
      });

      btn.disabled = false;
      btn.textContent = 'Send Reset Link';

      if (res.error) {
        errorBox.textContent = res.error.message;
        errorBox.classList.add('visible');
      } else {
        successBox.textContent = 'Password reset instructions have been sent to your email.';
        successBox.classList.add('visible');
        document.getElementById('email').value = '';
      }
    });
  </script>

</body>
</html>
