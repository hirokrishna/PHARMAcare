<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Products – PHARMAcare Seller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="dashboard-page">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <p>Pharmacy Panel</p>
        <h3 id="sidebar-shop-name">Seller Store</h3>
      </div>
      <nav class="sidebar-nav">
        <a href="/seller/dashboard.html"><i class="fas fa-gauge"></i> Dashboard</a>
        <a href="/seller/products.html" class="active"><i class="fas fa-boxes-stacked"></i> My Products</a>
        <a href="/seller/add-product.html"><i class="fas fa-plus-circle"></i> Add Product</a>
        <a href="/seller/orders.html"><i class="fas fa-bag-shopping"></i> Orders</a>
      </nav>
      <div class="sidebar-footer">
        <a href="/index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
        <a href="#" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</a>
      </div>
    </aside>

    <main class="dash-content">
      <div class="dash-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
        <div>
          <h1>My Inventory & Products</h1>
          <p>Manage your medicine listings, adjust prices, and update stock.</p>
        </div>
        <a href="/seller/add-product.html" class="btn btn-navy">
          <i class="fas fa-plus"></i> Add Product
        </a>
      </div>

      <div class="dash-card">
        <div class="dash-card-body" style="padding:0;">
          <div class="table-responsive">
            <table class="table" id="products-table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Rx</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="products-tbody">
                <tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted);">Loading products...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/seller.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function loadProducts() {
      var access = await checkSellerAccess();
      if (!access) return;

      if (access.sellerInfo && access.sellerInfo.shop_name) {
        document.getElementById('sidebar-shop-name').textContent = access.sellerInfo.shop_name;
      }

      var products = await getSellerProducts();
      var tbody = document.getElementById('products-tbody');

      if (!products || products.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7" style="text-align:center;padding:40px 20px;">
              <i class="fas fa-boxes-stacked" style="font-size:36px;color:var(--border);margin-bottom:12px;display:block;"></i>
              <p style="color:var(--muted);margin-bottom:14px;">You haven't listed any products yet.</p>
              <a href="/seller/add-product.html" class="btn btn-navy btn-sm"><i class="fas fa-plus"></i> Add Your First Product</a>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = products.map(function(p) {
        if (typeof enrichProduct === 'function') p = enrichProduct(p);
        var imgHtml = p.image_url
          ? '<img src="' + p.image_url + '" alt="' + p.name + '" style="width:40px;height:40px;object-fit:contain;border-radius:4px;border:1px solid var(--border);">'
          : '<div style="width:40px;height:40px;background:var(--grey-bg);display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--border);"><i class="fas fa-pills"></i></div>';

        return `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:10px;">
                ${imgHtml}
                <div>
                  <strong style="color:var(--navy);font-size:14px;display:block;">${p.name}</strong>
                  <span style="font-size:12px;color:var(--muted);">${p.pack_info || ''}</span>
                </div>
              </div>
            </td>
            <td>${p.categories ? p.categories.name : '-'}</td>
            <td>
              <strong>&#8377;${p.price.toFixed(2)}</strong>
              ${p.mrp > p.price ? '<br><small style="color:var(--muted);text-decoration:line-through;">&#8377;' + p.mrp.toFixed(2) + '</small>' : ''}
            </td>
            <td>
              <span class="badge-status ${p.stock === 0 ? 'status-cancelled' : (p.stock <= 10 ? 'status-packed' : 'status-delivered')}">
                ${p.stock} in stock
              </span>
            </td>
            <td>
              ${p.requires_prescription ? '<span class="badge-rx">Rx</span>' : '<span style="color:var(--muted);font-size:12px;">No</span>'}
            </td>
            <td>
              <button onclick="toggleProductActive('${p.id}', ${!p.is_active})" class="btn btn-sm ${p.is_active ? 'btn-outline-green' : 'btn-outline-danger'}" style="font-size:11px;padding:3px 8px;">
                ${p.is_active ? 'Active' : 'Inactive'}
              </button>
            </td>
            <td>
              <div style="display:flex;gap:6px;">
                <a href="/seller/add-product.html?id=${p.id}" class="btn btn-outline-green btn-sm" style="font-size:12px;" title="Edit Product">
                  <i class="fas fa-pen"></i>
                </a>
                <button onclick="deleteProduct('${p.id}')" class="btn btn-outline-danger btn-sm" style="font-size:12px;" title="Delete Product">
                  <i class="fas fa-trash-can"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function toggleProductActive(productId, newState) {
      var res = await db.from('products').update({ is_active: newState }).eq('id', productId);
      if (res.error) {
        showToast('Error updating status: ' + res.error.message, 'error');
      } else {
        showToast('Product status updated', 'success');
        loadProducts();
      }
    }

    async function deleteProduct(productId) {
      if (confirm('Are you sure you want to delete this product?')) {
        var res = await db.from('products').delete().eq('id', productId);
        if (res.error) {
          showToast('Could not delete product: ' + res.error.message, 'error');
        } else {
          showToast('Product deleted', 'success');
          loadProducts();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>

</body>
</html>
