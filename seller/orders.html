<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Orders – PHARMAcare Seller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="dashboard-page">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <p>Pharmacy Panel</p>
        <h3 id="sidebar-shop-name">Seller Store</h3>
      </div>
      <nav class="sidebar-nav">
        <a href="/seller/dashboard.html"><i class="fas fa-gauge"></i> Dashboard</a>
        <a href="/seller/products.html"><i class="fas fa-boxes-stacked"></i> My Products</a>
        <a href="/seller/add-product.html"><i class="fas fa-plus-circle"></i> Add Product</a>
        <a href="/seller/orders.html" class="active"><i class="fas fa-bag-shopping"></i> Orders</a>
      </nav>
      <div class="sidebar-footer">
        <a href="/index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
        <a href="#" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</a>
      </div>
    </aside>

    <main class="dash-content">
      <div class="dash-header">
        <h1>Customer Orders</h1>
        <p>View orders for your medicines, verify items, and update fulfillment tracking status.</p>
      </div>

      <div class="dash-card">
        <div class="dash-card-body" style="padding:0;">
          <div class="table-responsive">
            <table class="table" id="seller-orders-table">
              <thead>
                <tr>
                  <th>Order #</th>
                  <th>Product</th>
                  <th>Qty</th>
                  <th>Price</th>
                  <th>Delivery Address</th>
                  <th>Item Status</th>
                  <th>Update Status</th>
                </tr>
              </thead>
              <tbody id="seller-orders-tbody">
                <tr><td colspan="7" style="text-align:center;padding:24px;color:var(--muted);">Loading orders...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/seller.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function loadSellerOrders() {
      var access = await checkSellerAccess();
      if (!access) return;

      if (access.sellerInfo && access.sellerInfo.shop_name) {
        document.getElementById('sidebar-shop-name').textContent = access.sellerInfo.shop_name;
      }

      var items = await getSellerOrders();
      var tbody = document.getElementById('seller-orders-tbody');

      if (!items || items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:36px;color:var(--muted);">No customer orders received yet.</td></tr>';
        return;
      }

      var statuses = ['placed', 'confirmed', 'packed', 'shipped', 'delivered', 'cancelled'];

      tbody.innerHTML = items.map(function(item) {
        var o = item.orders || {};
        var addr = o.address_snapshot || {};
        var addrText = (addr.full_name || '') + ', ' + (addr.city || '') + ' (' + (addr.pincode || '') + ')';

        var optionsHtml = statuses.map(function(st) {
          return '<option value="' + st + '" ' + (st === item.item_status ? 'selected' : '') + '>' + st.toUpperCase() + '</option>';
        }).join('');

        return `
          <tr>
            <td><strong>#${o.order_no || 'ORD'}</strong></td>
            <td>
              <strong style="color:var(--navy);font-size:14px;">${item.product_name}</strong>
            </td>
            <td><strong>${item.quantity}</strong></td>
            <td>&#8377;${(item.price * item.quantity).toFixed(2)}</td>
            <td><small style="color:var(--text);">${addrText}</small></td>
            <td>
              <span class="badge-status status-${item.item_status}">${item.item_status.toUpperCase()}</span>
            </td>
            <td>
              <select onchange="updateItemStatus('${item.id}', this.value)" style="padding:4px 8px;border:1.5px solid var(--border);border-radius:4px;font-size:12px;font-family:inherit;">
                ${optionsHtml}
              </select>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function updateItemStatus(itemId, newStatus) {
      var res = await db.from('order_items').update({ item_status: newStatus }).eq('id', itemId);
      if (res.error) {
        showToast('Error updating status: ' + res.error.message, 'error');
      } else {
        showToast('Item status updated to ' + newStatus.toUpperCase(), 'success');
        loadSellerOrders();
      }
    }

    document.addEventListener('DOMContentLoaded', loadSellerOrders);
  </script>

</body>
</html>
