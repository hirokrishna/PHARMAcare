<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart – PHARMAcare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <section class="section">
    <div class="container">
      <div class="breadcrumb">
        <a href="/index.html">Home</a>
        <span>/</span>
        <span>Cart</span>
      </div>

      <div class="section-header" style="margin-bottom: 24px;">
        <h2>Shopping Cart</h2>
      </div>

      <div id="cart-container">
        <p class="loading-text"><i class="fas fa-spinner fa-spin"></i> Loading cart...</p>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/main.js"></script>
  <script>
    var currentCartItems = [];

    async function renderCart() {
      var container = document.getElementById('cart-container');
      var user = await getCurrentUser();

      if (!user) {
        container.innerHTML = `
          <div class="empty-state" style="padding:60px 0;">
            <i class="fas fa-lock" style="font-size:48px;color:var(--navy);margin-bottom:16px;"></i>
            <h2 style="color:var(--navy);font-size:20px;margin-bottom:8px;">Please Login to View Cart</h2>
            <p style="color:var(--muted);font-size:14px;margin-bottom:20px;">Your cart is safely saved with your account.</p>
            <a href="/login.html" class="btn btn-navy">Login to Account</a>
          </div>
        `;
        return;
      }

      currentCartItems = await getCartItems();

      currentCartItems.forEach(function(item) {
        if (!item.products && typeof getFallbackProduct === 'function') {
          item.products = getFallbackProduct(item.product_id);
        }
      });

      if (!currentCartItems || currentCartItems.length === 0) {
        container.innerHTML = `
          <div class="empty-state" style="padding:60px 0;">
            <i class="fas fa-cart-shopping" style="font-size:48px;color:var(--border);margin-bottom:16px;"></i>
            <h2 style="color:var(--navy);font-size:22px;margin-bottom:8px;">Your cart is empty</h2>
            <p style="color:var(--muted);font-size:14px;margin-bottom:24px;">Browse our wide range of medicines and health products.</p>
            <a href="/medicines.html" class="btn btn-navy">Browse Medicines</a>
          </div>
        `;
        return;
      }

      var subtotal = 0;
      var mrpTotal = 0;
      var hasRx = false;

      var itemsHtml = '';
      currentCartItems.forEach(function(item) {
        var p = item.products;
        if (!p) return;

        if (p.requires_prescription) hasRx = true;

        var lineTotal = p.price * item.quantity;
        var lineMrp = p.mrp * item.quantity;
        subtotal += lineTotal;
        mrpTotal += lineMrp;

        var imgTag = p.image_url
          ? '<img src="' + p.image_url + '" alt="' + p.name + '" style="width:70px;height:70px;object-fit:contain;border-radius:6px;background:var(--grey-bg);padding:4px;">'
          : '<div style="width:70px;height:70px;background:var(--grey-bg);border-radius:6px;display:flex;align-items:center;justify-content:center;"><i class="fas fa-pills" style="font-size:28px;color:var(--border);"></i></div>';

        itemsHtml += `
          <div class="card" style="padding:16px;margin-bottom:16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;">
            <a href="/product.html?id=${p.id}">${imgTag}</a>
            <div style="flex:1;min-width:200px;">
              <div style="display:flex;gap:6px;margin-bottom:4px;flex-wrap:wrap;">
                ${p.requires_prescription ? '<span class="badge-rx">Rx Required</span>' : ''}
              </div>
              <a href="/product.html?id=${p.id}" style="color:var(--navy);font-weight:600;font-size:15px;display:block;margin-bottom:2px;">${p.name}</a>
              <p style="color:var(--muted);font-size:12px;margin-bottom:6px;">${p.pack_info || ''}</p>
              <div style="display:flex;gap:8px;align-items:baseline;">
                <span style="font-weight:700;color:var(--navy);font-size:16px;">&#8377;${p.price.toFixed(2)}</span>
                ${p.mrp > p.price ? '<span style="color:var(--muted);font-size:13px;text-decoration:line-through;">&#8377;' + p.mrp.toFixed(2) + '</span>' : ''}
              </div>
            </div>

            <!-- Quantity Control -->
            <div style="display:flex;align-items:center;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--white);">
              <button onclick="handleQtyChange('${item.id}', ${item.quantity - 1})" style="padding:6px 12px;border:none;background:none;font-weight:700;cursor:pointer;color:var(--navy);">&minus;</button>
              <span style="padding:6px 10px;font-size:14px;font-weight:600;min-width:24px;text-align:center;">${item.quantity}</span>
              <button onclick="handleQtyChange('${item.id}', ${item.quantity + 1})" style="padding:6px 12px;border:none;background:none;font-weight:700;cursor:pointer;color:var(--navy);">&#43;</button>
            </div>

            <!-- Total for this item -->
            <div style="min-width:90px;text-align:right;">
              <span style="font-size:16px;font-weight:700;color:var(--navy);display:block;">&#8377;${lineTotal.toFixed(2)}</span>
            </div>

            <!-- Remove Button -->
            <button onclick="handleRemoveItem('${item.id}')" style="background:none;border:none;color:var(--red);cursor:pointer;padding:8px;" title="Remove Item">
              <i class="fas fa-trash-can"></i>
            </button>
          </div>
        `;
      });

      var discount = mrpTotal > subtotal ? mrpTotal - subtotal : 0;
      var deliveryFee = subtotal >= 499 ? 0 : 40;
      var finalTotal = subtotal + deliveryFee;

      container.innerHTML = `
        <div style="display:grid;grid-template-columns:1.4fr 0.8fr;gap:32px;align-items:start;">
          <!-- Left: Items List -->
          <div>
            ${hasRx ? `
              <div style="background:var(--mint);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:16px;font-size:13px;color:var(--text);display:flex;align-items:center;gap:10px;">
                <i class="fas fa-file-medical" style="color:var(--green);font-size:18px;"></i>
                <span>Your cart includes <strong>prescription medicines (Rx)</strong>. You can upload your doctor's prescription at checkout.</span>
              </div>
            ` : ''}

            ${itemsHtml}

            <div style="margin-top:16px;">
              <a href="/medicines.html" class="btn btn-outline-green btn-sm">
                <i class="fas fa-arrow-left"></i> Continue Shopping
              </a>
            </div>
          </div>

          <!-- Right: Order Summary -->
          <div class="card" style="padding:24px;position:sticky;top:90px;">
            <h3 style="color:var(--navy);font-size:18px;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:12px;">Order Summary</h3>

            <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;color:var(--text);">
              <span>MRP Total</span>
              <span>&#8377;${mrpTotal.toFixed(2)}</span>
            </div>

            ${discount > 0 ? `
              <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;color:var(--green);">
                <span>Discount</span>
                <span>&minus; &#8377;${discount.toFixed(2)}</span>
              </div>
            ` : ''}

            <div style="display:flex;justify-content:space-between;margin-bottom:10px;font-size:14px;color:var(--text);">
              <span>Delivery Fee</span>
              <span>${deliveryFee === 0 ? '<strong style="color:var(--green)">FREE</strong>' : '&#8377;40.00'}</span>
            </div>

            ${deliveryFee > 0 ? `
              <p style="font-size:12px;color:var(--muted);margin-bottom:14px;">Add &#8377;${(499 - subtotal).toFixed(2)} more for <strong>FREE Delivery</strong>.</p>
            ` : ''}

            <hr style="border:none;border-top:1.5px solid var(--border);margin:14px 0;">

            <div style="display:flex;justify-content:space-between;margin-bottom:20px;font-size:18px;font-weight:700;color:var(--navy);">
              <span>Total Amount</span>
              <span>&#8377;${finalTotal.toFixed(2)}</span>
            </div>

            <a href="/checkout.html" class="btn btn-green btn-block" style="text-align:center;font-size:15px;padding:12px;">
              Proceed to Checkout <i class="fas fa-arrow-right" style="margin-left:6px;"></i>
            </a>

            <div style="margin-top:16px;text-align:center;font-size:12px;color:var(--muted);">
              <i class="fas fa-shield-halved" style="color:var(--green);margin-right:4px;"></i> 100% Safe and Secure Checkout
            </div>
          </div>
        </div>
      `;
    }

    async function handleQtyChange(cartItemId, newQty) {
      if (newQty <= 0) {
        handleRemoveItem(cartItemId);
        return;
      }
      if (newQty > 10) {
        showToast('Maximum quantity allowed is 10', 'error');
        return;
      }
      var success = await updateCartQty(cartItemId, newQty);
      if (success) {
        await updateCartCount();
        await renderCart();
      } else {
        showToast('Could not update quantity', 'error');
      }
    }

    async function handleRemoveItem(cartItemId) {
      if (confirm('Are you sure you want to remove this item?')) {
        var success = await removeFromCart(cartItemId);
        if (success) {
          showToast('Item removed', 'success');
          await updateCartCount();
          await renderCart();
        } else {
          showToast('Could not remove item', 'error');
        }
      }
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>

</body>
</html>
