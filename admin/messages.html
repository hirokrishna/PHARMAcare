<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Messages – PHARMAcare Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="dashboard-page">
    <aside class="sidebar admin-sidebar">
      <div class="sidebar-brand">
        <p>Admin Control</p>
        <h3>PHARMAcare</h3>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin/dashboard.html"><i class="fas fa-gauge"></i> Dashboard</a>
        <a href="/admin/sellers.html"><i class="fas fa-store"></i> Sellers</a>
        <a href="/admin/users.html"><i class="fas fa-users"></i> Users</a>
        <a href="/admin/products.html"><i class="fas fa-boxes-stacked"></i> Products</a>
        <a href="/admin/orders.html"><i class="fas fa-bag-shopping"></i> Orders</a>
        <a href="/admin/categories.html"><i class="fas fa-list"></i> Categories</a>
        <a href="/admin/banners.html"><i class="fas fa-images"></i> Banners</a>
        <a href="/admin/messages.html" class="active"><i class="fas fa-envelope"></i> Messages</a>
      </nav>
      <div class="sidebar-footer">
        <a href="/index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
        <a href="#" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</a>
      </div>
    </aside>

    <main class="dash-content">
      <div class="dash-header">
        <h1>Contact Form Messages</h1>
        <p>Read customer inquiries, medical store partnership queries, and user feedback.</p>
      </div>

      <div class="dash-card">
        <div class="dash-card-body" style="padding:0;">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Sender</th>
                  <th>Message</th>
                  <th>Received On</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="messages-tbody">
                <tr><td colspan="5" style="text-align:center;padding:24px;color:var(--muted);">Loading messages...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function loadAdminMessages() {
      var access = await checkAdminAccess();
      if (!access) return;

      var res = await db.from('contact_messages').select('*').order('created_at', { ascending: false });
      var tbody = document.getElementById('messages-tbody');
      var list = (res && res.data) ? res.data : [];

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:36px;color:var(--muted);">No messages received yet.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(function(m) {
        var dt = new Date(m.created_at).toLocaleDateString('en-IN', {
          day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        return `
          <tr style="${!m.is_read ? 'background:#f0fdf4;' : ''}">
            <td>
              <strong style="color:var(--navy);font-size:14px;display:block;">${m.name}</strong>
              <a href="mailto:${m.email}" style="color:var(--green);font-size:12px;">${m.email}</a>
            </td>
            <td>
              <p style="font-size:13px;color:var(--text);line-height:1.5;max-width:440px;">${m.message}</p>
            </td>
            <td><small style="color:var(--muted);">${dt}</small></td>
            <td>
              <span class="badge-status ${m.is_read ? 'status-delivered' : 'status-packed'}">
                ${m.is_read ? 'READ' : 'NEW'}
              </span>
            </td>
            <td>
              <div style="display:flex;gap:6px;">
                <button onclick="toggleMessageRead(${m.id}, ${!m.is_read})" class="btn btn-outline-green btn-sm" style="font-size:11px;padding:3px 8px;">
                  Mark ${m.is_read ? 'Unread' : 'Read'}
                </button>
                <button onclick="deleteMessage(${m.id})" class="btn btn-outline-danger btn-sm" style="font-size:11px;padding:3px 8px;" title="Delete message">
                  <i class="fas fa-trash-can"></i>
                </button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function toggleMessageRead(id, newState) {
      var res = await db.from('contact_messages').update({ is_read: newState }).eq('id', id);
      if (res.error) {
        showToast('Error updating message status', 'error');
      } else {
        loadAdminMessages();
      }
    }

    async function deleteMessage(id) {
      if (confirm('Delete this message?')) {
        var res = await db.from('contact_messages').delete().eq('id', id);
        if (res.error) {
          showToast('Could not delete message', 'error');
        } else {
          showToast('Message deleted', 'success');
          loadAdminMessages();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', loadAdminMessages);
  </script>

</body>
</html>
