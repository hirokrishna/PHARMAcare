<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products – PHARMAcare Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="dashboard-page">
    <aside class="sidebar admin-sidebar">
      <div class="sidebar-brand">
        <p>Admin Control</p>
        <h3>PHARMAcare</h3>
      </div>
      <nav class="sidebar-nav">
        <a href="/admin/dashboard.html"><i class="fas fa-gauge"></i> Dashboard</a>
        <a href="/admin/sellers.html"><i class="fas fa-store"></i> Sellers</a>
        <a href="/admin/users.html"><i class="fas fa-users"></i> Users</a>
        <a href="/admin/products.html" class="active"><i class="fas fa-boxes-stacked"></i> Products</a>
        <a href="/admin/orders.html"><i class="fas fa-bag-shopping"></i> Orders</a>
        <a href="/admin/categories.html"><i class="fas fa-list"></i> Categories</a>
        <a href="/admin/banners.html"><i class="fas fa-images"></i> Banners</a>
        <a href="/admin/messages.html"><i class="fas fa-envelope"></i> Messages</a>
      </nav>
      <div class="sidebar-footer">
        <a href="/index.html"><i class="fas fa-arrow-left"></i> Back to Site</a>
        <a href="#" onclick="logout()"><i class="fas fa-right-from-bracket"></i> Logout</a>
      </div>
    </aside>

    <main class="dash-content">
      <div class="dash-header">
        <h1>Catalog & Product Inventory</h1>
        <p>Monitor all listed medicines and products across all registered pharmacies.</p>
      </div>

      <div class="dash-card">
        <div class="dash-card-header" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
          <input type="text" id="admin-prod-search" placeholder="Search product..." oninput="handleSearch()" style="padding:6px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;width:240px;outline:none;">
          <select id="admin-cat-filter" onchange="handleCatFilter()" style="padding:6px 12px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-family:inherit;">
            <option value="">All Categories</option>
          </select>
        </div>
        <div class="dash-card-body" style="padding:0;">
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Product</th>
                  <th>Category</th>
                  <th>Seller</th>
                  <th>Price</th>
                  <th>Stock</th>
                  <th>Rx</th>
                  <th>Visibility</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="admin-products-tbody">
                <tr><td colspan="8" style="text-align:center;padding:24px;color:var(--muted);">Loading products...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/main.js"></script>
  <script>
    var allProducts = [];
    var currentCat = '';
    var searchKeyword = '';

    async function loadAdminProducts() {
      var access = await checkAdminAccess();
      if (!access) return;

      // load categories
      var cats = await getCategories();
      var sel = document.getElementById('admin-cat-filter');
      cats.forEach(function(c) {
        var opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.name;
        sel.appendChild(opt);
      });

      var res = await db.from('products')
        .select('*, categories(name), profiles(full_name)')
        .order('created_at', { ascending: false });

      allProducts = (res && res.data) ? res.data : [];
      renderProductsTable();
    }

    function renderProductsTable() {
      var tbody = document.getElementById('admin-products-tbody');
      var list = allProducts;

      if (currentCat) {
        list = list.filter(function(p) { return p.category_id == currentCat; });
      }

      if (searchKeyword) {
        list = list.filter(function(p) {
          return (p.name || '').toLowerCase().includes(searchKeyword.toLowerCase());
        });
      }

      if (list.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:36px;color:var(--muted);">No products found.</td></tr>';
        return;
      }

      tbody.innerHTML = list.map(function(p) {
        if (typeof enrichProduct === 'function') p = enrichProduct(p);
        var sellerName = (p.profiles && p.profiles.full_name) ? p.profiles.full_name : 'Seller';
        var imgHtml = p.image_url
          ? '<img src="' + p.image_url + '" alt="' + p.name + '" style="width:36px;height:36px;object-fit:contain;border-radius:4px;border:1px solid var(--border);">'
          : '<div style="width:36px;height:36px;background:var(--grey-bg);display:flex;align-items:center;justify-content:center;border-radius:4px;color:var(--border);"><i class="fas fa-pills"></i></div>';

        return `
          <tr>
            <td>
              <div style="display:flex;align-items:center;gap:10px;">
                ${imgHtml}
                <div>
                  <a href="/product.html?id=${p.id}" target="_blank" style="color:var(--navy);font-weight:600;font-size:14px;display:block;">${p.name}</a>
                  <small style="color:var(--muted);">${p.pack_info || ''}</small>
                </div>
              </div>
            </td>
            <td>${p.categories ? p.categories.name : '-'}</td>
            <td><small style="color:var(--navy);font-weight:500;">${sellerName}</small></td>
            <td><strong>&#8377;${p.price.toFixed(2)}</strong></td>
            <td>
              <span class="badge-status ${p.stock === 0 ? 'status-cancelled' : (p.stock <= 10 ? 'status-packed' : 'status-delivered')}">
                ${p.stock}
              </span>
            </td>
            <td>
              ${p.requires_prescription ? '<span class="badge-rx">Rx</span>' : '<span style="color:var(--muted);font-size:12px;">No</span>'}
            </td>
            <td>
              <button onclick="toggleActive('${p.id}', ${!p.is_active})" class="btn btn-sm ${p.is_active ? 'btn-outline-green' : 'btn-outline-danger'}" style="font-size:11px;padding:3px 8px;">
                ${p.is_active ? 'Active' : 'Hidden'}
              </button>
            </td>
            <td>
              <button onclick="adminDeleteProduct('${p.id}')" class="btn btn-outline-danger btn-sm" style="font-size:11px;padding:3px 8px;" title="Delete product">
                <i class="fas fa-trash-can"></i>
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function handleSearch() {
      searchKeyword = document.getElementById('admin-prod-search').value.trim();
      renderProductsTable();
    }

    function handleCatFilter() {
      currentCat = document.getElementById('admin-cat-filter').value;
      renderProductsTable();
    }

    async function toggleActive(id, newState) {
      var res = await db.from('products').update({ is_active: newState }).eq('id', id);
      if (res.error) {
        showToast('Error: ' + res.error.message, 'error');
      } else {
        showToast('Product visibility updated', 'success');
        loadAdminProducts();
      }
    }

    async function adminDeleteProduct(id) {
      if (confirm('Delete this product permanently from the platform?')) {
        var res = await db.from('products').delete().eq('id', id);
        if (res.error) {
          showToast('Could not delete product: ' + res.error.message, 'error');
        } else {
          showToast('Product deleted', 'success');
          loadAdminProducts();
        }
      }
    }

    document.addEventListener('DOMContentLoaded', loadAdminProducts);
  </script>

</body>
</html>
