<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offers & Discounts – PHARMAcare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <section class="section">
    <div class="container">
      <div class="breadcrumb">
        <a href="/index.html">Home</a>
        <span>/</span>
        <span>Offers</span>
      </div>

      <div class="section-header" style="margin-bottom: 24px;">
        <div>
          <h2>Offers & Great Discounts</h2>
          <p style="color:var(--muted);font-size:14px;margin-top:4px;">Save big on genuine medicines and healthcare essentials</p>
        </div>
      </div>

      <!-- Offer Banner Strip -->
      <div style="background:var(--mint);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;">
        <div>
          <h3 style="color:var(--navy);font-size:18px;margin-bottom:4px;"><i class="fas fa-tag" style="color:var(--green);margin-right:8px;"></i>Special Deals</h3>
          <p style="color:var(--text);font-size:14px;">Get minimum 10% to 30% OFF on essential daily medicines and healthcare products.</p>
        </div>
        <span class="badge-discount" style="font-size:14px;padding:6px 14px;">Genuine Discounts</span>
      </div>

      <!-- Offers Grid -->
      <div class="product-grid" id="offers-grid">
        <p class="loading-text"><i class="fas fa-spinner fa-spin"></i> Loading offers...</p>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/main.js"></script>
  <script>
    async function loadOffers() {
      var grid = document.getElementById('offers-grid');
      var list = [];
      try {
        var res = await db.from('products')
          .select('*, categories(name)')
          .eq('is_active', true)
          .order('price', { ascending: true });
        if (res && res.data && res.data.length > 0) {
          list = res.data.map(function(p) {
            return typeof enrichProduct === 'function' ? enrichProduct(p) : p;
          });
        }
      } catch (e) {
        console.log('Using default products for offers');
      }

      if (list.length === 0 && typeof DEFAULT_PRODUCTS !== 'undefined') {
        list = DEFAULT_PRODUCTS;
      }

      // filter products having discount >= 10%
      var discounted = list.filter(function(p) {
        return p.mrp > p.price && Math.round(((p.mrp - p.price) / p.mrp) * 100) >= 10;
      });

      if (discounted.length === 0) {
        grid.innerHTML = '<p class="loading-text">No active offers at this moment. Check back soon!</p>';
        return;
      }

      var html = '';
      discounted.forEach(function(p) {
        var discount = Math.round(((p.mrp - p.price) / p.mrp) * 100) + '% OFF';
        var rxBadge = p.requires_prescription ? '<span class="badge-rx">Rx</span>' : '';
        var stockBadge = p.stock === 0 ? '<span class="badge-out">Out of stock</span>' : (p.stock <= 10 ? '<span class="badge-low-stock">Low stock</span>' : '');
        var imgTag = p.image_url
          ? '<img src="' + p.image_url + '" alt="' + p.name + '" class="product-card-img">'
          : '<div class="product-card-img" style="display:flex;align-items:center;justify-content:center;"><i class="fas fa-pills" style="font-size:40px;color:var(--border)"></i></div>';

        html += `
          <div class="product-card">
            <a href="/product.html?id=${p.id}">${imgTag}</a>
            <div class="product-card-body">
              <div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px">${rxBadge}${stockBadge}</div>
              <a href="/product.html?id=${p.id}" class="product-card-name">${p.name}</a>
              <p class="product-card-pack">${p.pack_info || ''}</p>
              <div class="product-card-price">
                <span class="price-current">&#8377;${p.price.toFixed(2)}</span>
                <span class="price-mrp">&#8377;${p.mrp.toFixed(2)}</span>
                <span class="badge-discount">${discount}</span>
              </div>
            </div>
            <div class="product-card-footer">
              <button class="btn btn-green btn-block btn-sm" onclick="addToCart('${p.id}', 1)" ${p.stock === 0 ? 'disabled' : ''}>
                <i class="fas fa-cart-plus"></i> ${p.stock === 0 ? 'Out of Stock' : 'Add to Cart'}
              </button>
            </div>
          </div>
        `;
      });

      grid.innerHTML = html;
    }

    document.addEventListener('DOMContentLoaded', loadOffers);
  </script>

</body>
</html>
