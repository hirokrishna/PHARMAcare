<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – PHARMAcare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/forms.css">
</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="form-page">
    <div class="form-card">
      <div class="form-card-header">
        <h1>Welcome Back</h1>
        <p>Login to your PHARMAcare account</p>
      </div>

      <div class="form-alert form-alert-error" id="error-msg"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-with-icon">
            <input type="password" id="password" placeholder="Enter your password" required>
            <i class="fas fa-eye input-icon-right" id="toggle-pw"></i>
          </div>
        </div>
        <a href="/forgot-password.html" class="forgot-link">Forgot password?</a>
        <button type="submit" class="btn btn-navy btn-block" id="login-btn">Login</button>
      </form>

      <div class="form-footer-link">
        Don't have an account? <a href="/register.html">Register here</a>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/products.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/orders.js"></script>
  <script src="/js/main.js"></script>
  <script>
    // toggle password visibility
    document.getElementById('toggle-pw').addEventListener('click', function() {
      var pw = document.getElementById('password');
      var isText = pw.type === 'text';
      pw.type = isText ? 'password' : 'text';
      this.className = isText ? 'fas fa-eye input-icon-right' : 'fas fa-eye-slash input-icon-right';
    });

    document.getElementById('login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;
      var errorBox = document.getElementById('error-msg');
      var btn = document.getElementById('login-btn');

      errorBox.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Logging in...';

      var res = await db.auth.signInWithPassword({ email: email, password: password });

      if (res.error) {
        errorBox.textContent = res.error.message;
        errorBox.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Login';
        return;
      }

      // check if user is blocked
      var profile = await getProfile(res.data.user.id);
      if (profile && profile.is_blocked) {
        await db.auth.signOut();
        errorBox.textContent = 'Account blocked, please contact support.';
        errorBox.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Login';
        return;
      }

      // role-based redirect
      var role = profile ? profile.role : 'customer';
      var savedRedirect = localStorage.getItem('redirect_after_login');

      if (role === 'admin') {
        window.location.href = '/admin/dashboard.html';
      } else if (role === 'seller') {
        window.location.href = '/seller/dashboard.html';
      } else {
        if (savedRedirect) {
          localStorage.removeItem('redirect_after_login');
          window.location.href = savedRedirect;
        } else {
          window.location.href = '/index.html';
        }
      }
    });
  </script>

</body>
</html>
